[package]
name = "zsh-history-backup"
version = "0.1.0"
edition = "2024"
description = "Safe, timestamp-aware backups for Zsh EXTENDED_HISTORY"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.20"
toml = "0.8"
